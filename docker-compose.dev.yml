# Hot-reload overlay for working on the code. Deliberately NOT named
# docker-compose.override.yml: that name auto-merges, which made `make start`
# silently run Vite instead of the nginx build that actually ships.
#
#   make dev     # this overlay: Vite + uvicorn --reload + source mounts
#   make start   # what the operator runs: nginx + built bundle
#
# Scheduler: code mounts apply after `make restart` (no auto-reload).

services:
  webapp:
    image: node:20-alpine
    build: !reset null
    working_dir: /app
    volumes:
      - ./webapp:/app
      - /app/node_modules
    environment:
      - VITE_DEV_API_PROXY=http://api:8000
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
    ports: !override
      - "127.0.0.1:2705:5173"
    command:
      - sh
      - -c
      - |
        npm ci 2>/dev/null || npm install
        exec npm run dev -- --host 0.0.0.0 --port 5173

  api:
    volumes:
      - ./api:/app/api
    command:
      - uvicorn
      - api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  scheduler:
    # Mounts only — restart container to pick up Python changes.
    volumes:
      - ./api:/app/api
      - ./scheduler:/app/scheduler
