server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Static Vite bundle
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Signed download links sent to Telegram must open from a phone that has
    # no Basic Auth credentials. The HMAC in the path is the authentication
    # here, checked by the API. Keep this prefix to that one endpoint.
    location /api/public/ {
        auth_basic off;
        proxy_pass http://api:8000/api/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy REST API calls to the FastAPI container.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}
