# Production-ready local-first compose.
#
# Services:
#   tiktok-base — helper service that only exists to build the shared base
#                 image that api and scheduler derive from.
#                 `docker compose build` builds it once; dependent services
#                 pull it by name.
#   api         — FastAPI REST API + OpenAPI docs at /docs (port 8000)
#   scheduler   — polling worker for pipeline uploads
#   webapp      — React UI served by nginx, proxies /api (port 3000)
#
# Ports are bound to 127.0.0.1 so nothing is exposed outside the host.

services:
  tiktok-base:
    image: tiktok-base:latest
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    command: ["true"]  # never runs; exists to build the image

  api:
    image: tiktok-api:latest
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      - tiktok-base
    environment:
      - TIKTOK_API_DB_PATH=/data/tiktok.db
      - TIKTOK_CONFIG_PATH=/app/config.txt
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - HOST=${HOST:-}
    volumes:
      - ./data:/data
      - ./config.txt:/app/config.txt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /data  # so Config() resolves CookiesDir/VideosDirPath on the volume
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  scheduler:
    image: tiktok-scheduler:latest
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    depends_on:
      - tiktok-base
      - api
    environment:
      - TIKTOK_API_DB_PATH=/data/tiktok.db
      - TIKTOK_CONFIG_PATH=/app/config.txt
      - SCHEDULER_POLL_SECONDS=30
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - SCHEDULER_CONCURRENCY=4
      - PIPELINE_TMP_DIR=/data/pipeline_tmp
      - DOUYIN_TMP_DIR=/data/douyin_tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./config.txt:/app/config.txt:ro
    working_dir: /data
    restart: unless-stopped

  # Static UI is baked into the image at build time. After changing webapp
  # source, rebuild before recreating: `docker compose build webapp` then
  # `docker compose up -d webapp` (or `docker compose up --build -d`). Using
  # only `up --force-recreate` reuses the previous image and stale assets.
  webapp:
    image: tiktok-webapp:latest
    build:
      context: .
      dockerfile: webapp/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    restart: unless-stopped
